name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "tools/place-ingestion/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tools/place-ingestion/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-package-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Place ingestion accounting and safety
        working-directory: tools/place-ingestion
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Pre-pull pinned MinIO test image
        run: docker pull bitnamilegacy/minio:2025.7.23-debian-12-r5

      - name: Verify private product worker refuses unbound standalone execution
        working-directory: tools/place-ingestion
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.executable, "operations/product_evidence_worker.py"], capture_output=True, timeout=5)
          assert result.returncode == 2
          assert b"--authorization-reference" in result.stderr
          assert b"--predecessor-sha256" in result.stderr
          assert not result.stdout
          print("PRODUCT_WORKER_UNBOUND_LAUNCH_REJECTED")
          PY

      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build production image
        run: docker build --tag phokarta-backend:ci .

      - name: Verify private rollback launcher fails closed without authorization
        shell: bash
        run: |
          set +e
          output=$(docker run --rm --network none \
            --entrypoint /bin/sh phokarta-backend:ci -c \
            'unset JAVA_TOOL_OPTIONS; exec java -Dloader.main=com.emirrkls.phokarta.backend.operations.PlacePilotRollbackApplication -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher' 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'PLACE_ROLLBACK_FAILED:STARTUP_OR_OPERATION_FAILED'

      - name: Verify GET-only baseline diagnosis launcher fails closed without configuration
        shell: bash
        run: |
          set +e
          output=$(docker run --rm --network none \
            --entrypoint /bin/sh phokarta-backend:ci -c \
            'unset JAVA_TOOL_OPTIONS; exec java -Dloader.main=com.emirrkls.phokarta.backend.operations.PlacePilotBaselineDiagnosisApplication -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher' 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'PLACE_BASELINE_DIAGNOSIS_FAILED:INVALID_CONFIGURATION_OR_ARTIFACT'

      - name: Verify private persistent telemetry launcher fails closed without configuration
        shell: bash
        run: |
          set +e
          output=$(docker run --rm --network none \
            --entrypoint /bin/sh phokarta-backend:ci -c \
            'unset JAVA_TOOL_OPTIONS; exec java -Dloader.main=com.emirrkls.phokarta.backend.operations.PlacePilotPersistentTelemetryApplication -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher' 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'PERSISTENT_TELEMETRY_FAILED:INVALID_CONFIGURATION_OR_EVIDENCE'

      - name: Verify private persistent telemetry launcher rejects malformed independently hashed plan
        shell: bash
        run: |
          set +e
          output=$(docker run --rm --network none \
            --entrypoint /bin/sh phokarta-backend:ci -c '
              unset JAVA_TOOL_OPTIONS
              mkdir -m 700 /tmp/private-probe
              printf "{}" > /tmp/private-probe/plan.json
              chmod 600 /tmp/private-probe/plan.json
              digest=$(sha256sum /tmp/private-probe/plan.json | cut -d " " -f 1)
              exec java -Dloader.main=com.emirrkls.phokarta.backend.operations.PlacePilotPersistentTelemetryApplication -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher --plan-path=/tmp/private-probe/plan.json --plan-sha256="$digest" --output-path=/tmp/private-probe/PRE.json' 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'PERSISTENT_TELEMETRY_FAILED:INVALID_CONFIGURATION_OR_EVIDENCE'

      - name: Preserve backend regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-reports
          path: backend/target/surefire-reports/TEST-*.xml
          retention-days: 7
