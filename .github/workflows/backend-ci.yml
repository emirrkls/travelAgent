name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "tools/place-ingestion/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tools/place-ingestion/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-package-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Place ingestion accounting and safety
        working-directory: tools/place-ingestion
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Pre-pull pinned MinIO test image
        run: docker pull bitnamilegacy/minio:2025.7.23-debian-12-r5

      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build production image
        run: docker build --tag phokarta-backend:ci .

      - name: Verify private rollback launcher fails closed without authorization
        shell: bash
        run: |
          set +e
          output=$(docker run --rm --network none \
            --entrypoint /bin/sh phokarta-backend:ci -c \
            'unset JAVA_TOOL_OPTIONS; exec java -Dloader.main=com.emirrkls.phokarta.backend.operations.PlacePilotRollbackApplication -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher' 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'PLACE_ROLLBACK_FAILED:STARTUP_OR_OPERATION_FAILED'
