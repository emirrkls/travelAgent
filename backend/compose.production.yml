name: phokarta

services:
  backend:
    image: ${PHOKARTA_IMAGE:-phokarta-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PHOKARTA_DB_URL: ${PHOKARTA_DB_URL:-jdbc:postgresql://db:5432/phokarta}
      PHOKARTA_DB_USER: ${PHOKARTA_DB_USER:?set PHOKARTA_DB_USER}
      PHOKARTA_DB_PASSWORD: ${PHOKARTA_DB_PASSWORD:?set PHOKARTA_DB_PASSWORD}
      PHOKARTA_JWT_SECRET: ${PHOKARTA_JWT_SECRET:?set PHOKARTA_JWT_SECRET}
      PHOKARTA_JWT_ACCESS_TTL: ${PHOKARTA_JWT_ACCESS_TTL:-15m}
      PHOKARTA_JWT_REFRESH_TTL: ${PHOKARTA_JWT_REFRESH_TTL:-30d}
      PHOKARTA_CORS_ALLOWED_ORIGINS: ${PHOKARTA_CORS_ALLOWED_ORIGINS:?set PHOKARTA_CORS_ALLOWED_ORIGINS}
      PHOKARTA_MEDIA_ENABLED: ${PHOKARTA_MEDIA_ENABLED:-true}
      PHOKARTA_MEDIA_BUCKET: ${PHOKARTA_MEDIA_BUCKET:?set PHOKARTA_MEDIA_BUCKET}
      PHOKARTA_MEDIA_REGION: ${PHOKARTA_MEDIA_REGION:?set PHOKARTA_MEDIA_REGION}
      PHOKARTA_MEDIA_ENDPOINT: ${PHOKARTA_MEDIA_ENDPOINT:-}
      PHOKARTA_MEDIA_PATH_STYLE: ${PHOKARTA_MEDIA_PATH_STYLE:-false}
      PHOKARTA_MEDIA_ACCESS_KEY: ${PHOKARTA_MEDIA_ACCESS_KEY:-}
      PHOKARTA_MEDIA_SECRET_KEY: ${PHOKARTA_MEDIA_SECRET_KEY:-}
      PHOKARTA_MEDIA_UPLOAD_TTL: ${PHOKARTA_MEDIA_UPLOAD_TTL:-15m}
      PHOKARTA_MEDIA_READ_TTL: ${PHOKARTA_MEDIA_READ_TTL:-10m}
      PHOKARTA_MEDIA_MAX_BYTES: ${PHOKARTA_MEDIA_MAX_BYTES:-15728640}
      PHOKARTA_MEDIA_MAX_PER_VISIT: ${PHOKARTA_MEDIA_MAX_PER_VISIT:-20}
      PHOKARTA_MEDIA_UNATTACHED_TTL: ${PHOKARTA_MEDIA_UNATTACHED_TTL:-48h}
      PHOKARTA_MEDIA_CLEANUP_BATCH_SIZE: ${PHOKARTA_MEDIA_CLEANUP_BATCH_SIZE:-100}
      PHOKARTA_MEDIA_CLEANUP_INTERVAL: ${PHOKARTA_MEDIA_CLEANUP_INTERVAL:-1h}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:?set APP_ENVIRONMENT}
      PHOKARTA_RELEASE: ${PHOKARTA_RELEASE:-unknown}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:-30s}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-10MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-10MB}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=UTC}
    expose:
      - "8080"
      - "8081"
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null 'http://127.0.0.1:8081/actuator/health/readiness'"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    networks:
      - edge
      - data

  db:
    image: postgis/postgis:16-3.5
    profiles: ["self-hosted-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phokarta}
      POSTGRES_USER: ${PHOKARTA_DB_USER:?set PHOKARTA_DB_USER}
      POSTGRES_PASSWORD: ${PHOKARTA_DB_PASSWORD:?set PHOKARTA_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    networks:
      - data

  caddy:
    image: caddy:2.10-alpine
    environment:
      PHOKARTA_DOMAIN: ${PHOKARTA_DOMAIN:?set PHOKARTA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILES:-5}
    networks:
      - edge

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
