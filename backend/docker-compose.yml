services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phokarta}
      POSTGRES_USER: ${POSTGRES_USER:-phokarta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phokarta}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - phokarta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phokarta} -d ${POSTGRES_DB:-phokarta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-phokarta-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-phokarta-minio-dev-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - phokarta_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${PHOKARTA_MEDIA_BUCKET};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-phokarta-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-phokarta-minio-dev-only}
      PHOKARTA_MEDIA_BUCKET: ${PHOKARTA_MEDIA_BUCKET:-phokarta-local-media}

volumes:
  phokarta_pgdata:
  phokarta_minio_data:
