spring:
  flyway:
    locations: classpath:db/migration/schema,classpath:db/migration/dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

phokarta:
  media:
    enabled: ${PHOKARTA_MEDIA_ENABLED:true}
    endpoint: ${PHOKARTA_MEDIA_ENDPOINT:http://localhost:9000}
    path-style: true
    access-key: ${PHOKARTA_MEDIA_ACCESS_KEY:phokarta-minio}
    secret-key: ${PHOKARTA_MEDIA_SECRET_KEY:phokarta-minio-dev-only}

logging:
  level:
    com.emirrkls.phokarta.backend: DEBUG
    org.flywaydb: INFO
