spring:
  datasource:
    url: ${PHOKARTA_DB_URL}
    username: ${PHOKARTA_DB_USER}
    password: ${PHOKARTA_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-init-sql: SET TIME ZONE 'UTC'
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/schema
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

phokarta:
  environment: ${APP_ENVIRONMENT}
  jwt:
    secret: ${PHOKARTA_JWT_SECRET}
  cors:
    allowed-origins: ${PHOKARTA_CORS_ALLOWED_ORIGINS}
  media:
    enabled: true
    bucket: ${PHOKARTA_MEDIA_BUCKET}
    region: ${PHOKARTA_MEDIA_REGION}
    endpoint: ${PHOKARTA_MEDIA_ENDPOINT:}
    path-style: ${PHOKARTA_MEDIA_PATH_STYLE:false}
    access-key: ${PHOKARTA_MEDIA_ACCESS_KEY:}
    secret-key: ${PHOKARTA_MEDIA_SECRET_KEY:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${PHOKARTA_RELEASE:unknown}
        environment: ${APP_ENVIRONMENT}
  level:
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
