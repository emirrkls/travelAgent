spring:
  application:
    name: phokarta-backend
  datasource:
    url: ${PHOKARTA_DB_URL:jdbc:postgresql://localhost:5432/phokarta}
    username: ${PHOKARTA_DB_USER:phokarta}
    password: ${PHOKARTA_DB_PASSWORD:phokarta}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/schema
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

phokarta:
  environment: ${APP_ENVIRONMENT:local}
  demo-user-id: 11111111-1111-1111-1111-111111111111
  place-import:
    # Disabled-by-default private one-shot autonomous canary. The dedicated
    # place-import profile and this explicit switch are both required. The runner
    # captures real pre-import HTTP/database baselines, imports, replays for
    # idempotency, probes/audits, then records the immutable gate and contains failure.
    # base-url must be loopback on local.server.port and include exactly the configured
    # servlet context path. Health uses the derived local.management.port without redirects.
    # A passing one-shot closes its application context; a failure aborts startup.
    enabled: ${PHOKARTA_PLACE_IMPORT_ENABLED:false}
    manifest-path: ${PHOKARTA_PLACE_IMPORT_MANIFEST_PATH:}
    expected-manifest-hash: ${PHOKARTA_PLACE_IMPORT_EXPECTED_MANIFEST_HASH:}
    authorization-reference: ${PHOKARTA_PLACE_IMPORT_AUTHORIZATION_REFERENCE:}
    base-url: ${PHOKARTA_PLACE_IMPORT_BASE_URL:}
    baseline-place-id: ${PHOKARTA_PLACE_IMPORT_BASELINE_PLACE_ID:}
    probe-samples: ${PHOKARTA_PLACE_IMPORT_PROBE_SAMPLES:5}
    probe-timeout: ${PHOKARTA_PLACE_IMPORT_PROBE_TIMEOUT:5s}
    # Successful imports receive this initial durable deadline. Immediately before
    # post-import probing it is extended from the full selected-count/sample/timeout
    # request budget (plus margin, capped at 24h). The always-on startup/scheduled
    # reconciler fails and contains an ungated run after expiry.
    gate-deadline-lease: ${PHOKARTA_PLACE_IMPORT_GATE_DEADLINE_LEASE:65m}
    gate-reconciliation-interval: ${PHOKARTA_PLACE_IMPORT_GATE_RECONCILIATION_INTERVAL:1m}
  place-canary-gate:
    # Disabled-by-default manual emergency containment only. It can record FAILED,
    # never PASS, and also requires the dedicated place-canary-gate profile.
    # checked-at is optional; an empty value makes the service use database server time.
    enabled: ${PHOKARTA_PLACE_CANARY_GATE_ENABLED:false}
    sync-run-id: ${PHOKARTA_PLACE_CANARY_GATE_SYNC_RUN_ID:}
    diagnostics-path: ${PHOKARTA_PLACE_CANARY_GATE_DIAGNOSTICS_PATH:}
    requested-pass: ${PHOKARTA_PLACE_CANARY_GATE_REQUESTED_PASS:false}
    checked-at: ${PHOKARTA_PLACE_CANARY_GATE_CHECKED_AT:}
  cors:
    allowed-origins: ${PHOKARTA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    # Must be at least 32 characters. Override via PHOKARTA_JWT_SECRET — never commit real secrets.
    secret: ${PHOKARTA_JWT_SECRET:phokarta-dev-only-jwt-secret-change-me-32b}
    access-token-ttl: ${PHOKARTA_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${PHOKARTA_JWT_REFRESH_TTL:30d}
  geo:
    max-radius-meters: 50000
    default-radius-meters: 5000
    max-map-limit: 200
    default-map-limit: 50
  pagination:
    default-page-size: 20
    max-page-size: 100
  media:
    enabled: ${PHOKARTA_MEDIA_ENABLED:false}
    bucket: ${PHOKARTA_MEDIA_BUCKET:phokarta-local-media}
    region: ${PHOKARTA_MEDIA_REGION:us-east-1}
    endpoint: ${PHOKARTA_MEDIA_ENDPOINT:}
    path-style: ${PHOKARTA_MEDIA_PATH_STYLE:false}
    access-key: ${PHOKARTA_MEDIA_ACCESS_KEY:}
    secret-key: ${PHOKARTA_MEDIA_SECRET_KEY:}
    max-bytes: ${PHOKARTA_MEDIA_MAX_BYTES:15728640}
    max-per-visit: ${PHOKARTA_MEDIA_MAX_PER_VISIT:20}
    accepted-content-types:
      - image/jpeg
      - image/png
      - image/webp
    upload-ttl: ${PHOKARTA_MEDIA_UPLOAD_TTL:15m}
    read-ttl: ${PHOKARTA_MEDIA_READ_TTL:10m}
    unattached-ttl: ${PHOKARTA_MEDIA_UNATTACHED_TTL:48h}
    cleanup-batch-size: ${PHOKARTA_MEDIA_CLEANUP_BATCH_SIZE:100}
    cleanup-interval: ${PHOKARTA_MEDIA_CLEANUP_INTERVAL:1h}
    # Extra wait after upload-ttl before the final object delete. Final job
    # completion is created_at + upload-ttl + this grace, so a still-valid
    # pre-deletion presigned PUT cannot recreate a permanent orphan.
    deletion-verify-grace: ${PHOKARTA_MEDIA_DELETION_VERIFY_GRACE:2m}
  safety:
    report-max-per-hour: ${PHOKARTA_REPORT_MAX_PER_HOUR:10}
    block-max-per-hour: ${PHOKARTA_BLOCK_MAX_PER_HOUR:60}
  policy:
    # Technical beta User Policy version. Not final legal Terms.
    # Override with PHOKARTA_POLICY_REQUIRED_VERSION when Terms are reissued.
    required-version: ${PHOKARTA_POLICY_REQUIRED_VERSION:2026-08-beta}
  features:
    profile-privacy-v2:
      # Activation stays off until both mobile clients support pending requests.
      enabled: ${PHOKARTA_PROFILE_PRIVACY_V2_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: false

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
