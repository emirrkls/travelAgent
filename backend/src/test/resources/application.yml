phokarta:
  place-import:
    # Integration-test application contexts outlive their per-class Testcontainers.
    # Keep production reconciliation enabled at its normal cadence while preventing
    # cached test contexts from polling PostgreSQL containers that have already stopped.
    gate-reconciliation-interval: 24h
  features:
    profile-privacy-v2:
      enabled: true
  jwt:
    secret: phokarta-test-jwt-secret-do-not-use-elsewhere-32
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  media:
    enabled: false
    bucket: test-media
    region: us-east-1
    path-style: true
    access-key: test-only
    secret-key: test-only-secret
    max-bytes: 15728640
    max-per-visit: 20
    accepted-content-types:
      - image/jpeg
      - image/png
      - image/webp
    upload-ttl: 15m
    read-ttl: 10m
    unattached-ttl: 48h
    cleanup-batch-size: 100
    cleanup-interval: 1h
