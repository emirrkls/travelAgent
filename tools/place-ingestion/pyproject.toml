[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phokarta-place-ingestion"
version = "0.1.0"
description = "Provider-neutral Place ingestion and Turkey coverage benchmark tooling"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.0",
]

[project.scripts]
phokarta-place-benchmark = "phokarta_place_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
